[platformio]
src_dir = src
include_dir = include

[env]
platform = https://github.com/tasmota/platform-espressif32/releases/download/2023.06.02/platform-espressif32.zip ;; Tasmota Arduino Core 2.0.9 with IPv6 support, based on IDF 4.4.4
platform_packages =
framework = arduino
monitor_speed = 115200
# slow upload speed but most compatible
upload_speed = 115200
lib_ldf_mode = deep+

lib_deps =
    WiFi
    TPUart

# Build flags
build_flags =
    -DMASK_VERSION=0x091A
    -DKNX_TUNNELING=10
    -DKNX_ROUTING
    -DKNX_BAUDRATE=19200
    -DNCN5120

[env:tul_esp32c3]
board = seeed_xiao_esp32c3
build_flags = 
    ${env.build_flags}
    -I"/root/.platformio/packages/framework-arduinoespressif32-libs/esp32c3/include/esp_wifi/include"
    -DKNX_LED=4
    -DKNX_BUTTON=9
    -DKNX_SERIAL=Serial0
    -DKNX_RX_PIN=20
    -DKNX_TX_PIN=21

